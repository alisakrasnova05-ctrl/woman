include:
  - project: pipelines/pipelines
    ref: master
    file:
      - /jobs/spirit.yaml
      - /jobs/build.yaml
      - /jobs/rules.yaml

stages:
  - build
  - deploy

variables:
  # Spirit Docker Registry used by Kaniko and by the deployment VM.
  DOCKER_ARTIFACTORY_REGISTRY: registry.spirit.t-education.com
  IMAGE_NAME: ${DOCKER_ARTIFACTORY_REGISTRY}/${CI_PROJECT_ROOT_NAMESPACE}/${CI_PROJECT_NAME}:${CI_COMMIT_SHORT_SHA}

  # Set DEPLOY_HOST in Spirit repository CI variables to the public VM address.
  DEPLOY_HOST: CHANGE_ME_VM_IP
  DEPLOY_USER: root
  DEPLOY_IMG: registry.spirit.t-education.com/cicd-images/base-noble:release-1.1.0

# Build and publish the Docker image. This also runs for merge requests;
# deployment jobs below are restricted to master by the shared rules.
build:image:
  extends:
    - .dp_build
    - .rules-merge-or-master-or-parent
  after_script:
    - |
      if [ "$CI_JOB_STATUS" = "success" ]; then
        echo "Image published: $IMAGE_NAME"
      fi

.ssh_vm:
  image: $DEPLOY_IMG
  variables:
    SSH: "ssh -i $DEPLOY_KEY -o StrictHostKeyChecking=accept-new"
    SCP: "scp -i $DEPLOY_KEY -o StrictHostKeyChecking=accept-new"
    VM: "$DEPLOY_USER@$DEPLOY_HOST"
    DP_CLI_VERSION: "14.1.3"
  before_script:
    - |
      if [ "$DEPLOY_HOST" = "CHANGE_ME_VM_IP" ]; then
        echo "Set DEPLOY_HOST in Spirit repository CI variables."; exit 1
      fi
    - command -v ssh >/dev/null || (apt-get update -qq && apt-get install -y -qq --no-install-recommends openssh-client)
    - chmod 600 "$DEPLOY_KEY"

setup:vm:
  stage: deploy
  extends:
    - .ssh_vm
    - .rules-master
  script:
    - |
      $SSH $VM "command -v dp >/dev/null || (
        curl -fL https://spirit.t-education.com/static/cli/tedu/$DP_CLI_VERSION/linux/dp -o /tmp/dp &&
        chmod +x /tmp/dp && sudo mv /tmp/dp /usr/local/bin/dp )"

deploy:vm:
  stage: deploy
  extends:
    - .ssh_vm
    - .rules-master
  needs: ["build:image", "setup:vm"]
  resource_group: production
  script:
    - $SSH $VM "mkdir -p ~/app"
    - $SCP deploy/docker-compose.yml "$SPIRIT_DOCKER_SA_KEY" "$VM:app/"
    - |
      $SSH $VM "cd ~/app &&
        sudo dp auth service-acc --key-file $(basename $SPIRIT_DOCKER_SA_KEY) &&
        sudo dp auth configure-docker &&
        sudo IMAGE_NAME=$IMAGE_NAME docker compose pull &&
        sudo IMAGE_NAME=$IMAGE_NAME docker compose up -d"
    - |
      if $SSH $VM "curl -fsS --retry 20 --retry-delay 2 --retry-all-errors -o /dev/null http://localhost:${APP_PORT:-80}"; then
        echo "Deployment is healthy: http://$DEPLOY_HOST:${APP_PORT:-80}"
      else
        echo "The container started but did not answer the health check."
        exit 1
      fi
  environment:
    name: production
