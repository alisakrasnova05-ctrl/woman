<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>explore. — Swagger</title>
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.18.2/swagger-ui.css">
  <style>
    html { box-sizing: border-box; overflow-y: scroll; }
    *, *::before, *::after { box-sizing: inherit; }
    body { margin: 0; background: #fafafa; }
    .swagger-ui .topbar { background: #182b3a; }
    .swagger-ui .topbar-wrapper .link { max-width: none; }
    .swagger-ui .topbar-wrapper .link::after { content: "explore. API"; color: #fff; font-size: 17px; font-weight: 600; margin-left: 12px; }
    .swagger-ui .topbar-wrapper .link svg { display: none; }
    .architecture-link { position: fixed; z-index: 10; top: 14px; right: max(24px, calc((100% - 1180px) / 2)); color: #fff; font-size: 14px; text-decoration: none; }
    .architecture-link:hover { text-decoration: underline; }
    @media (max-width: 600px) { .architecture-link { top: 17px; right: 14px; font-size: 12px; } }
  </style>
</head>
<body>
  <a class="architecture-link" href="/architecture">Архитектура</a>
  <div id="swagger-ui"></div>
  <script src="https://unpkg.com/swagger-ui-dist@5.18.2/swagger-ui-bundle.js"></script>
  <script src="https://unpkg.com/swagger-ui-dist@5.18.2/swagger-ui-standalone-preset.js"></script>
  <script>
    window.onload = () => {
      window.ui = SwaggerUIBundle({
        url: '/api/openapi.json',
        dom_id: '#swagger-ui',
        deepLinking: true,
        presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
        layout: 'StandaloneLayout'
      });
    };
  </script>
</body>
</html>
