<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TravelHub</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="/styles.css"></head><body><header><div class="brand">✈ <span>TravelHub</span></div><div class="trip">Москва · 12–14 июня 2025</div></header><main><section class="sidebar"><div class="section-head"><h2>События поездки</h2><button id="addBtn" class="primary">＋ Добавить</button></div><div id="days" class="days"></div><div id="timeline"></div></section><section class="map-wrap"><div id="map"></div><div class="map-hint">Нажмите на точку, чтобы найти событие</div></section></main><dialog id="eventDialog"><form method="dialog" id="eventForm"><div class="dialog-head"><h2 id="formTitle">Новое событие</h2><button type="button" id="closeBtn">×</button></div><input type="hidden" id="eventId"><label>Название<input id="title" required placeholder="Например, Ужин в ресторане"></label><label>Тип<select id="type"><option value="excursion">Экскурсия / достопримечательность</option><option value="stay">Проживание</option><option value="restaurant">Ресторан</option><option value="meeting">Встреча</option><option value="other">Другое</option></select></label><div class="row"><label>Дата<input type="date" id="date" required></label><label>Начало<input type="time" id="startTime" required></label><label>Окончание<input type="time" id="endTime"></label></div><label>Дата окончания (если после полуночи)<input type="date" id="endDate"></label><label>Точка маршрута<select id="pointId"><option value="">Без геоточки</option></select></label><label>Описание<textarea id="description" rows="3"></textarea></label><label>Ссылка на билет / бронь<input type="url" id="bookingUrl" placeholder="https://..."></label><label>Материалы (ссылки через запятую)<input id="materials" placeholder="https://...jpg, https://...jpg"></label><div id="formError" class="error"></div><div class="actions"><button type="button" id="cancelBtn" class="secondary">Отмена</button><button class="primary">Сохранить</button></div></form></dialog><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="/app.js"></script></body></html>
