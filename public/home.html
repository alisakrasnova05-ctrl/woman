<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Traveler's Glider — путешествия</title>
    <link rel="stylesheet" href="/home.css">
    <link rel="stylesheet" href="/theme.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/journal.css">
<meta name="description" content="Traveler&#39;s Glider — ваш живой журнал путешествий.">
</head>
  <body>
    <header>
      <div class="brand"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="m3 10 18-7-7 18-3-8-8-3Zm8 3L21 3"/></svg></span><span>Traveler's Glider</span></div>
      <nav class="site-nav" aria-label="Навигация">
        <a href="#trips">Мои путешествия</a>
      </nav>
    <span class="brand-tagline">Планы обретают крылья</span></header>
    <main>
      <section class="create-panel">
        <div>
          <p class="eyebrow">НОВОЕ ПУТЕШЕСТВИЕ</p>
          <h1>Куда отправимся?</h1>
          <p class="muted">Выберите дату и город, придумайте название и добавьте фото обложки.</p>
        </div>
        <form id="tripForm">
          <label><span>КОГДА</span><div class="selects"><select id="month"></select><select id="year"></select></div></label>
          <label class="origin-field"><span>ОТКУДА</span><div class="destination-field"><input id="origin" type="text" maxlength="100" placeholder="Город отправления" autocomplete="off"></div></label>
          <label class="destination"><span>КУДА</span><div class="destination-field"><input id="destination" placeholder="Казань, Санкт-Петербург, Байкал" autocomplete="off"></div></label>
          <label class="trip-title-field"><span>НАЗВАНИЕ ПОЕЗДКИ</span><input id="tripTitle" type="text" maxlength="60" placeholder="Например, Летние каникулы"></label>
          <label class="cover-upload"><span>ФОТО ДЛЯ ОБЛОЖКИ</span><input id="coverFile" type="file" accept="image/jpeg,image/png"><small id="coverFileName">Выберите JPG или PNG, до 10 МБ</small><img id="coverPreview" alt="Предпросмотр обложки" hidden></label>
          <button class="add-btn">Добавить</button>
          <div id="formError" class="error"></div>
        </form>
      </section>
      <section class="history">
        <div class="history-head"><div><p class="eyebrow">МОИ ПУТЕШЕСТВИЯ</p></div><span id="count" class="count"></span></div>
        <div id="trips" class="trip-list"></div>
      </section>
    </main>
    <script src="/journal-icons.js"></script>
<script src="/city-picker.js"></script>
    <script src="/home.js"></script>
  <script src="/journal.js"></script>
</body>
</html>
